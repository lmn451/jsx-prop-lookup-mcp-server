name: Publish validated beta

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Check npm authentication without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-jsx-prop-lookup-4.0.0-beta.0
  cancel-in-progress: false

env:
  BETA_VERSION: 4.0.0-beta.0

jobs:
  check-npm-auth:
    if: inputs.diagnostics_only
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm registry authentication
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - name: Check the stored publishing identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

  publish-beta:
    if: github.ref == 'refs/heads/codex/publish-4.0.0-beta.0' && !inputs.diagnostics_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated PR commit
        uses: actions/checkout@v4
        with:
          ref: 825de158fbb3de38671e0adf805c0436650e3827
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare beta version
        run: npm version "$BETA_VERSION" --no-git-tag-version --ignore-scripts

      - name: Validate the beta package
        run: npm run prepublishOnly

      - name: Check release version mutations
        run: npm run test:mutation

      - name: Pack validated files
        run: npm pack --ignore-scripts

      - name: Verify stable tag before publishing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://registry.npmjs.org/-/package/jsx-prop-lookup-mcp-server/dist-tags');
          assert.equal(response.status, 200);
          assert.equal((await response.json()).latest, '3.5.0');
          NODE

      - name: Publish only the beta tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./jsx-prop-lookup-mcp-server-${BETA_VERSION}.tgz" --tag beta --access public --registry=https://registry.npmjs.org --ignore-scripts

      - name: Verify published tags
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://registry.npmjs.org/-/package/jsx-prop-lookup-mcp-server/dist-tags');
          assert.equal(response.status, 200);
          const tags = await response.json();
          assert.equal(tags.beta, process.env.BETA_VERSION);
          assert.equal(tags.latest, '3.5.0');
          console.log(JSON.stringify(tags));
          NODE
